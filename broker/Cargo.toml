[package]
name = "broker"
version = "0.1.0"
edition = "2021"
description = "Local memory broker: short-term working set + long-term minky retrieval cascade (stdio MCP)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
dirs = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "2.1.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
wiremock = "0.6"
